# Builds the Web export on every push to main (including merged PRs) and publishes it to GitHub Pages.
name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_DIR: ${{ github.workspace }}/../godot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The editor plus just the web templates (the full template bundle is ~1.3 GB).
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$GODOT_DIR/templates"
          cd "$GODOT_DIR"
          curl -fsSL -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q editor.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d templates
          rm editor.zip templates.tpz

      - name: Install export templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp "$GODOT_DIR"/templates/* "$dest/"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"

      # .godot/ isn't committed, so build the import cache and script class list first.
      - name: Import project
        run: godot --headless --import

      - name: Run tests
        run: godot --headless res://tests/sim_test.tscn

      - name: Export for web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
